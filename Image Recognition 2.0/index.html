<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scorpio</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- ML5 -->
    <script src="https://cdn.jsdelivr.net/npm/ml5@0.4.3/dist/ml5.min.js"></script>

    <!-- WebcamJS -->
    <script src="https://cdn.jsdelivr.net/npm/webcamjs@1.0.26/webcam.min.js"></script>

    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .main-card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 40px 30px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        max-width: 900px;
        width: 100%;
        text-align: center;
      }

      .header-title {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 10px;
      }

      .header-sub {
        color: #6c757d;
        margin-bottom: 30px;
        font-size: 18px;
      }

      .camera-box,
      .result-box {
        background: #f8f9fa;
        border: 2px dashed #b2bec3;
        border-radius: 15px;
        height: 280px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        margin-bottom: 20px;
        position: relative;
      }

      #camera {
        width: 100%;
        height: 100%;
      }

      #result img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 12px;
      }

      .btn-custom {
        margin-top: 10px;
      }

      .result-panel {
        background: #eef2f3;
        border-radius: 10px;
        padding: 15px;
        text-align: left;
        margin-top: 20px;
      }

      .result-panel p {
        margin: 0;
        font-size: 16px;
        color: #2d3436;
      }
    </style>
  </head>

  <body>
    <div class="main-card">
      <h2 class="header-title">
        <i class="bi bi-robot"></i> Image Recognition
      </h2>

      <p class="header-sub">
        Capture an image using your webcam and allow the AI identify the object!
      </p>

      <div class="row">
        <div class="col-md-6">
          <h5 class="mb-3 text-primary">Live Camera</h5>

          <div class="camera-box">
            <div id="camera"></div>
          </div>

          <button
            class="btn btn-primary btn-custom w-100"
            onclick="take_snapshot()"
          >
            <i class="bi bi-camera-fill"></i> Capture Image
          </button>
        </div>

        <div class="col-md-6">
          <h5 class="mb-3 text-secondary">Captured Output</h5>

          <div class="result-box">
            <div id="result">
              <span class="text-muted">
                <i class="bi bi-file-earmark-image"></i>
                Image not captured yet!
              </span>
            </div>
          </div>

          <button
            class="btn btn-success btn-custom w-100"
            onclick="identifyObject()"
          >
            <i class="bi bi-search"></i>
            Identify Object
          </button>
        </div>
      </div>

      <div class="result-panel">
        <div class="row text-center text-md-start">
          <div class="col-md-6">
            <p>
              <strong>Object:</strong>
              <span id="result_object_name">-</span>
            </p>
          </div>

          <div class="col-md-6">
            <p>
              <strong>Accuracy:</strong>
              <span id="result_object_accuracy">-</span>
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      Webcam.set({
        width: 350,
        height: 280,
        image_format: "png",
        png_quality: 90,
      });

      Webcam.attach("#camera");

      function take_snapshot() {
        Webcam.snap(function (captured_image) {
          document.getElementById("result").innerHTML =
            `<img id="outputImage" src="${captured_image}">`;
        });
      }

      let model = ml5.imageClassifier(
        "https://teachablemachine.withgoogle.com/models/vBLsLNbstK/model.json",
        modelReady,
      );

      function modelReady() {
        console.log("Model loaded successfully!");
      }

      function identifyObject() {
        let output_image = document.getElementById("outputImage");

        if (output_image) {
          model.classify(output_image, function (error, results) {
            if (error) {
              alert(error);
              console.error(error);
            } else {
              document.getElementById("result_object_name").innerHTML =
                results[0].label;

              document.getElementById("result_object_accuracy").innerHTML =
                (results[0].confidence * 100).toFixed(2) + "%";
            }
          });
        } else {
          alert("Please capture an image first to identify.");
        }
      }
    </script>
  </body>
</html>
